<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f9ff;
      color: #1f2f3d;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 1rem;
      text-align: center;
      background: #3399FF;
      color: white;
      font-size: 1.5rem;
    }
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #ccc;
      background: #f4f9ff;
      max-width: 900px;
      margin: auto;
    }
    #toolbar button {
      background: white;
      border: 1px solid #3399FF;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
    }
    #editorWrapper {
      max-width: 900px;
      margin: auto;
      padding: 1rem;
    }
    #tabsContainer {
      max-width: 900px;
      margin: auto;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      align-items: flex-end;
      gap: 0.25rem;
      padding: 0.5rem;
      background: #dbeeff;
    }
    .tab {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .tab button {
      border: none;
      background: #e0f0ff;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      font-weight: bold;
      white-space: nowrap;
    }
    .tab.active button {
      background: #3399FF;
      color: white;
    }
    .category-line {
      height: 5px;
      width: 100%;
      background: gray;
    }
    #editor {
      border: 1px solid #ccc;
      border-radius: 8px;
      min-height: 400px;
      padding: 1rem;
      background: white;
      font-size: 10pt;
    }
    #timestamps {
      font-size: 0.85rem;
      color: #777;
      margin-top: 0.5rem;
      text-align: right;
    }
  </style>
  <script>
let tabs = JSON.parse(localStorage.getItem('tabs')) || [];
let categories = [
  { name: 'General' },
  { name: 'Ideas' },
  { name: 'Research' }
];
let activeTab = null;

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  tabs.forEach(tab => {
    const tabEl = document.createElement('div');
    tabEl.className = 'tab';

    const btn = document.createElement('button');
    btn.textContent = tab.name;
    btn.onclick = () => switchTab(tab);

    const line = document.createElement('div');
    line.className = 'category-line';
    line.style.background = tab.color || 'gray';

    tabEl.appendChild(btn);
    tabEl.appendChild(line);
    container.appendChild(tabEl);
  });
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('editor').innerHTML = tab.content;
  document.getElementById('createdTag').textContent = 'Created: ' + tab.created;
  document.getElementById('editedTag').textContent = 'Last edited: ' + tab.edited;
  renderTabs();
  const allTabs = document.querySelectorAll('.tab');
  allTabs.forEach(t => t.classList.remove('active'));
  const matched = Array.from(allTabs).find(t => t.querySelector('button')?.textContent === tab.name);
  if (matched) matched.classList.add('active');
}
    function showTabModal() {
  const modal = document.getElementById('tabModal');
  const dropdown = document.getElementById('categoryDropdown');
  dropdown.innerHTML = '';
  categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.name;
    opt.textContent = cat.name;
    dropdown.appendChild(opt);
  });
  modal.style.display = 'flex';
}
    function showSearchModal() {
      alert('Search modal function not implemented yet.');
    }
    function createCategoryPrompt() {
      alert('Category creation not implemented yet.');
    }
    function submitNewTab() {
  const nameInput = document.getElementById('tabNameInput');
  const categoryDropdown = document.getElementById('categoryDropdown');
  const tabName = nameInput.value.trim();
  const category = categoryDropdown.value;

  if (!tabName || !category) {
    alert("Please enter a tab name and select a category.");
    return;
  }

  const newTab = {
    id: Date.now(),
    name: tabName,
    category: category,
    color: '#3399FF',
    content: '',
    created: new Date().toISOString(),
    edited: new Date().toISOString()
  };

  tabs.push(newTab);
  localStorage.setItem('tabs', JSON.stringify(tabs));
  renderTabs();
  switchTab(newTab);
  document.getElementById('tabModal').style.display = 'none';
}
    function format(cmd, value = null) {
      document.execCommand(cmd, false, value);
    }
    function formatHeader(level) {
      document.execCommand('formatBlock', false, 'H' + level);
    }
    function addLink() {
      const url = prompt('Enter URL:');
      if (url) {
        document.execCommand('createLink', false, url);
      }
    }
  function updateActiveTab() {
  if (activeTab) {
    activeTab.content = document.getElementById('editor').innerHTML;
    activeTab.edited = new Date().toISOString();
    localStorage.setItem('tabs', JSON.stringify(tabs));
    document.getElementById('editedTag').textContent = 'Last edited: ' + activeTab.edited;
  }
}

window.onload = () => {
  renderTabs();
  if (tabs.length > 0) switchTab(tabs[0]);
};
function showSearchModal() {
  const modal = document.getElementById('searchModal');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.value = '';
  results.innerHTML = '';
  modal.style.display = 'flex';
  input.focus();
}

function closeSearchModal() {
  document.getElementById('searchModal').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('searchInput');
  if (input) {
    input.addEventListener('input', () => {
      const query = input.value.toLowerCase();
      const results = document.getElementById('searchResults');
      results.innerHTML = '';

      const matches = tabs.filter(t =>
        t.name.toLowerCase().includes(query) ||
        (t.category && t.category.toLowerCase().includes(query))
      );

      if (matches.length === 0) {
        results.innerHTML = '<p style="color:gray">No results found.</p>';
        return;
      }

      matches.forEach(tab => {
  const div = document.createElement('div');
  div.style.padding = '0.5rem 0';
  div.style.cursor = 'pointer';
  div.style.borderBottom = '1px solid #ddd';

  const title = document.createElement('div');
  title.textContent = `${tab.name} (${tab.category})`;
  title.style.fontWeight = 'bold';
  div.appendChild(title);

  const preview = document.createElement('div');
  preview.innerHTML = tab.content.slice(0, 100) + (tab.content.length > 100 ? '...' : '');
  preview.style.fontSize = '0.9em';
  preview.style.color = '#555';
  preview.style.marginTop = '0.25rem';
  div.appendChild(preview);

  div.onclick = () => {
    switchTab(tab);
    closeSearchModal();
  };

  results.appendChild(div);
});
    });
  }
});
</script>
</head>
<body>
  <header>Notepad</header>

  <div style="display: flex; justify-content: center; background: #dbeeff; padding: 0.5rem 0; gap: 0.5rem; flex-wrap: wrap;">
    <button onclick="showTabModal()" style="background: #3399FF; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">+ New Tab</button>
    <button style="background: #3399FF; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: not-allowed;">Reserved</button>
    <button style="background: #3399FF; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: not-allowed;">Reserved</button>
    <button style="background: #3399FF; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Open Tab</button>
    <button onclick="showSearchModal()" style="background: #3399FF; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Search Tabs</button>
  </div>

  <div id="tabModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
    <div style="background:white; padding:2rem; border-radius:10px; width:300px; text-align:center;">
      <h3>Create New Tab</h3>
      <input id="tabNameInput" type="text" placeholder="Tab name" style="width:100%; margin-bottom:0.5rem; padding:0.5rem;" />
      <select id="categoryDropdown" style="width:100%; margin-bottom:0.5rem; padding:0.5rem;"></select>
      <button onclick="createCategoryPrompt()" style="margin-bottom:1rem; background:#ccc; border:none; padding:0.4rem 0.6rem; cursor:pointer;">...or create a new category</button>
      <br />
      <button onclick="submitNewTab()" style="background:#3399FF; color:white; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer;">Create Tab</button>
      <br />
      <button onclick="this.closest('#tabModal').style.display='none'" style="margin-top:1rem;">Cancel</button>
    </div>
  </div>

  <div id="tabsContainer"></div>
  <div id="toolbar">
    <button onclick="format('bold')"><strong>B</strong></button>
    <button onclick="format('italic')"><em>I</em></button>
    <button onclick="format('underline')"><u>U</u></button>
    <button onclick="format('strikeThrough')"><s>S</s></button>
    <button onclick="format('insertUnorderedList')">• List</button>
    <button onclick="format('insertOrderedList')">1. List</button>
    <button onclick="formatHeader(1)">H1</button>
    <button onclick="formatHeader(2)">H2</button>
    <button onclick="formatHeader(3)">H3</button>
    <button onclick="formatHeader(4)">H4</button>
    <button onclick="formatHeader(5)">H5</button>
    <button onclick="format('backColor', 'yellow')">Highlight</button>
    <button onclick="addLink()">Link</button>
  </div>
  <div id="editorWrapper">
    <div id="editor" contenteditable="true" oninput="updateActiveTab()"></div>
    <div id="timestamps">
      <div id="createdTag">Created: </div>
      <div id="editedTag">Last edited: </div>
    </div>
  </div>
<div id="searchModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div style="background:white; padding:2rem; border-radius:10px; width:400px; text-align:center;">
    <h3>Search Tabs</h3>
    <input id="searchInput" type="text" placeholder="Search by name or category" style="width:100%; margin-bottom:1rem; padding:0.5rem;">
    <div id="searchResults" style="text-align:left; max-height:200px; overflow-y:auto;"></div>
    <button onclick="closeSearchModal()" style="margin-top:1rem; background:#3399FF; color:white; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer;">Close</button>
  </div>
</div>

</body>
</html>
