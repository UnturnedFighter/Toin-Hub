<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Generator | Toin Tools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f9ff;
      color: #1f2f3d;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #3399FF;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #d6ecff;
      flex-wrap: wrap;
    }

    nav button {
      background: none;
      border: none;
      padding: 1rem;
      font-size: 1rem;
      cursor: pointer;
      color: #1f2f3d;
    }

    nav button.active {
      border-bottom: 3px solid #3399FF;
      font-weight: bold;
    }

    .tab {
      display: none;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }

    .tab.active {
      display: block;
    }

    button.generate {
      background-color: #3399FF;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      margin-top: 1rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .output, .output-log {
      margin-top: 1rem;
      font-size: 1.1rem;
    }

    .output-log {
      padding: 1rem;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Toin Name Generator</h1>
    <p>Generate names from different regions of the Democratic States of Toin</p>
  </header>

  <nav>
    <button class="tablink active" data-tab="toinan">Toinan English</button>
    <button class="tablink" data-tab="chaudiere">Chaudière French</button>
    <button class="tablink" data-tab="acterland-en">Acterland English</button>
    <button class="tablink" data-tab="acterland-gaelic">Acterland Gaelic</button>
    <button class="tablink" data-tab="tacakyawt">Táčakyáwt</button>
  </nav>

  <div id="content"></div>

  <script>
    const nameGroups = [
      { id: "toinan", label: "Toinan English", file: "output-toinan-en.json" },
      { id: "chaudiere", label: "Chaudière French", file: "output-chaudiere-fr.json" },
      { id: "acterland-en", label: "Acterland English", file: "output-acterland-en.json" },
      { id: "acterland-gaelic", label: "Acterland Gaelic", file: "output-acterland-gd.json" },
      { id: "tacakyawt", label: "Táčakyáwt", file: "output-tacakyawt.json" }
    ];

    const contentDiv = document.getElementById("content");

    nameGroups.forEach(group => {
      const section = document.createElement("section");
      section.id = group.id;
      section.className = "tab" + (group.id === "toinan" ? " active" : "");

      section.innerHTML = `
        <h2>${group.label} Names</h2>
        <button class="generate" onclick="generateName('${group.file}', 'output-${group.id}-male', 'log-${group.id}-male', 'male')">Generate Male</button>
        <div class="output" id="output-${group.id}-male"></div>
        <div class="output-log" id="log-${group.id}-male"></div>

        <button class="generate" onclick="generateName('${group.file}', 'output-${group.id}-female', 'log-${group.id}-female', 'female')">Generate Female</button>
        <div class="output" id="output-${group.id}-female"></div>
        <div class="output-log" id="log-${group.id}-female"></div>
      `;

      contentDiv.appendChild(section);
    });

    async function generateName(jsonFile, outputId, logId, gender) {
      try {
        const response = await fetch(jsonFile);
        if (!response.ok) throw new Error("File not found or inaccessible");
        const text = await response.text();
        const data = JSON.parse(text);

        const firstList = gender === 'male' ? data.first_male : data.first_female;
        if (!Array.isArray(firstList) || !Array.isArray(data.last)) throw new Error("Invalid name data format");

        const first = firstList[Math.floor(Math.random() * firstList.length)];
        const last = data.last[Math.floor(Math.random() * data.last.length)];
        const fullName = `${first} ${last}`;

        document.getElementById(outputId).innerText = fullName;

        const logDiv = document.getElementById(logId);
        const entry = document.createElement('div');
        entry.innerText = fullName;
        logDiv.prepend(entry);
      } catch (err) {
        document.getElementById(outputId).innerText = "Error loading or parsing names.";
        console.error(err);
      }
    }

    document.querySelectorAll('.tablink').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tablink').forEach(btn => btn.classList.remove('active'));
        document.getElementById(button.dataset.tab).classList.add('active');
        button.classList.add('active');
      });
    });
  </script>
</body>
</html>
