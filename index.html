  <script>
    function getFirstFullWeekSaturday(year, monthIndex) {
      const first = new Date(Date.UTC(year, monthIndex, 1));
      const firstWeekday = first.getUTCDay();
      const offset = firstWeekday === 0 ? 6 : 13 - firstWeekday;
      return new Date(Date.UTC(year, monthIndex, offset, 12));
    }

    function getLastFullWeekSaturday(year, monthIndex) {
      const last = new Date(Date.UTC(year, monthIndex + 1, 0));
      const lastWeekday = last.getUTCDay();
      const offset = lastWeekday === 6 ? 0 : lastWeekday + 1;
      return new Date(Date.UTC(year, monthIndex + 1, 0 - offset, 12));
    }

    function updateClocks() {
      const now = new Date();
      const year = now.getUTCFullYear();

      const dstStart = getFirstFullWeekSaturday(year, 10); // Nov
      const dstEnd = getLastFullWeekSaturday(year, 2); // March
      const isToinDST = now >= dstStart || now < dstEnd;
      const toinOffset = isToinDST ? -8 : -9;

      const jan = new Date(now.getFullYear(), 0, 1);
      const jul = new Date(now.getFullYear(), 6, 1);
      const standardOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
      const isLocalDST = now.getTimezoneOffset() < standardOffset;

      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const toinDate = new Date(utc + toinOffset * 3600000);

      const diffHours = Math.round((toinDate - now) / 3600000);
      const direction = diffHours > 0 ? 'BEHIND' : 'AHEAD';
      const ofText = direction === 'AHEAD' ? ' of Toin' : '';
      const timeDiffString = `You are ${Math.abs(diffHours)} hours ${direction}${ofText}`;

      document.getElementById('clock-section').innerHTML = `
        <div><strong>Your Local Time:</strong> ${now.toLocaleString()}</div>
        <div><strong>Time in Toin:</strong> ${toinDate.toLocaleString()}</div>
        <div><strong>${timeDiffString}</strong></div>
        ${isToinDST ? '<div class="dst-warning">DST in effect in Toin</div>' : ''}
        ${isLocalDST ? '<div class="dst-warning">DST in effect at your location</div>' : ''}
      `;
    }

    setInterval(updateClocks, 1000);
    updateClocks();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
